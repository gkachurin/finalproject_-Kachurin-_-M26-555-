[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Платформа для симуляции торговли валютами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[dependency-groups]
dev = ["ruff>=0.17.4"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.valutatrade]
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
history_file = "data/exchange_rates.json"
log_file = "logs/actions.log"
parser_log_file = "logs/parser.log"
rates_ttl = 300
default_base_currency = "USD"
log_level = "INFO"
log_format = "text"
log_max_bytes = 1048576
log_backup_count = 3